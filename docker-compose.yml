services:
  app:
    image: ghcr.io/luanimadh/staygames:latest
    # To build locally from source instead of pulling from GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: staygames-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-staygames}
      - DB_PASSWORD=${DB_PASSWORD:-staygames_secret}
      - DB_NAME=${DB_NAME:-staygames}
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_long_random_jwt_secret}
      - JWT_EXPIRES_IN_SECONDS=${JWT_EXPIRES_IN_SECONDS:-1209600}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - LDAP_URL=${LDAP_URL:-ldap://openldap:389}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-dc=staygames,dc=local}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-cn=admin,dc=staygames,dc=local}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-admin}
      - LDAP_USER_SEARCH_BASE=${LDAP_USER_SEARCH_BASE:-ou=users,dc=staygames,dc=local}
      - LDAP_USER_SEARCH_FILTER=${LDAP_USER_SEARCH_FILTER:-(&(objectClass=inetOrgPerson)(uid=%s))}
      - LDAP_SYNC_FILTER=${LDAP_SYNC_FILTER:-(objectClass=inetOrgPerson)}
      - LDAP_ATTR_UID=${LDAP_ATTR_UID:-uid}
      - LDAP_ATTR_USERNAME=${LDAP_ATTR_USERNAME:-uid}
      - LDAP_ATTR_DISPLAY_NAME=${LDAP_ATTR_DISPLAY_NAME:-cn}
      - LDAP_ATTR_EMAIL=${LDAP_ATTR_EMAIL:-mail}
      - LDAP_TLS_REJECT_UNAUTHORIZED=${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      - LDAP_SYNC_ON_STARTUP=${LDAP_SYNC_ON_STARTUP:-true}
      - LDAP_MOCK_MODE=${LDAP_MOCK_MODE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      openldap:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: staygames-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-staygames}
      MYSQL_USER: ${DB_USER:-staygames}
      MYSQL_PASSWORD: ${DB_PASSWORD:-staygames_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_EXTERNAL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Dummy/local OpenLDAP server pre-configured with admin/admin and test users
  openldap:
    image: osixia/openldap:1.5.0
    container_name: staygames-openldap
    restart: unless-stopped
    command: ["--loglevel", "warning", "--copy-service"]
    environment:
      LDAP_ORGANISATION: "StayGames Friends"
      LDAP_DOMAIN: "staygames.local"
      LDAP_ADMIN_PASSWORD: "${LDAP_BIND_PASSWORD:-admin}"
      LDAP_TLS: "false"
    configs:
      - source: ldap_bootstrap
        target: /container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    ports:
      - "127.0.0.1:389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=staygames,dc=local -w ${LDAP_BIND_PASSWORD:-admin} -b dc=staygames,dc=local -s base '(objectclass=*)' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s

configs:
  ldap_bootstrap:
    content: |
      dn: ou=users,dc=staygames,dc=local
      objectClass: organizationalUnit
      ou: users

      dn: uid=admin,ou=users,dc=staygames,dc=local
      objectClass: top
      objectClass: person
      objectClass: organizationalPerson
      objectClass: inetOrgPerson
      uid: admin
      cn: Admin
      sn: Administrator
      givenName: Admin
      mail: admin@staygames.local
      userPassword: admin

      dn: uid=alice,ou=users,dc=staygames,dc=local
      objectClass: top
      objectClass: person
      objectClass: organizationalPerson
      objectClass: inetOrgPerson
      uid: alice
      cn: Alice Becker
      sn: Becker
      givenName: Alice
      mail: alice@staygames.local
      userPassword: password

      dn: uid=bob,ou=users,dc=staygames,dc=local
      objectClass: top
      objectClass: person
      objectClass: organizationalPerson
      objectClass: inetOrgPerson
      uid: bob
      cn: Bob Lindner
      sn: Lindner
      givenName: Bob
      mail: bob@staygames.local
      userPassword: password

      dn: uid=charlie,ou=users,dc=staygames,dc=local
      objectClass: top
      objectClass: person
      objectClass: organizationalPerson
      objectClass: inetOrgPerson
      uid: charlie
      cn: Charlie Novak
      sn: Novak
      givenName: Charlie
      mail: charlie@staygames.local
      userPassword: password

      dn: uid=diana,ou=users,dc=staygames,dc=local
      objectClass: top
      objectClass: person
      objectClass: organizationalPerson
      objectClass: inetOrgPerson
      uid: diana
      cn: Diana Weber
      sn: Weber
      givenName: Diana
      mail: diana@staygames.local
      userPassword: password

      dn: uid=erik,ou=users,dc=staygames,dc=local
      objectClass: top
      objectClass: person
      objectClass: organizationalPerson
      objectClass: inetOrgPerson
      uid: erik
      cn: Erik Hoffmann
      sn: Hoffmann
      givenName: Erik
      mail: erik@staygames.local
      userPassword: password

volumes:
  mysql_data:
  openldap_data:
  openldap_config:
